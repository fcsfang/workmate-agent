name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Python syntax check
        run: python -m py_compile agent/*.py memory/*.py src/*.py tools/*.py tests/*.py evals/run_eval.py

      - name: Run pytest
        run: pytest

      - name: Run evaluation smoke test
        run: python evals/run_eval.py --report-dir /tmp/workmate-eval-reports --min-score 1.0
